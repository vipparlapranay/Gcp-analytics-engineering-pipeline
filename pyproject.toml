[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gcp-analytics-engineering-pipeline"
version = "1.0.0"
description = "Cost-aware BigQuery and dbt pipeline with an Airflow daily DAG."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.2,<2.0",
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<4.0",
    "pyarrow>=19,<25",
    "plotly>=5.24,<7.0",
    "streamlit>=1.41,<2.0",
]

[project.optional-dependencies]
dev = ["dbt-core>=1.9,<2.0", "dbt-duckdb>=1.9,<2.0", "pytest>=8.3,<9.0"]
gcp = ["dbt-bigquery>=1.9,<2.0", "google-cloud-bigquery>=3.27,<4.0", "google-cloud-storage>=2.19,<4.0"]

[project.scripts]
gcp-analytics = "gcp_analytics.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

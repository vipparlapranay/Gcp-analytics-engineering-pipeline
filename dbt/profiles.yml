gcp_retail_analytics:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', 'results/analytics.duckdb') }}"
      schema: analytics
      threads: 4
    bigquery:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: "{{ env_var('DBT_DATASET', 'analytics') }}"
      location: "{{ env_var('BIGQUERY_LOCATION', 'US') }}"
      threads: 4
      job_execution_timeout_seconds: 300
      job_retries: 2
      maximum_bytes_billed: "{{ env_var('BIGQUERY_MAX_BYTES_BILLED', '1000000000') | int }}"
